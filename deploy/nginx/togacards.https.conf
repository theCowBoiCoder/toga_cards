limit_req_zone $binary_remote_addr zone=toga_checkout:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=toga_admin:10m rate=20r/m;
server {
    listen 80;
    listen [::]:80;
    server_name togacards.co.uk www.togacards.co.uk;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://togacards.co.uk$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.togacards.co.uk;
    ssl_certificate /etc/letsencrypt/live/togacards.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/togacards.co.uk/privkey.pem;
    return 301 https://togacards.co.uk$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name togacards.co.uk;
    ssl_certificate /etc/letsencrypt/live/togacards.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/togacards.co.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /api/ebay/callback {
        # OAuth query strings contain short-lived credentials.
        access_log off;
        include /etc/nginx/snippets/toga-cards-proxy.conf;
    }
    location = /api/shop/checkout {
        limit_req zone=toga_checkout burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/toga-cards-proxy.conf;
    }
    location ~ ^/(admin(?:/|$)|api/(?:admin(?:/|$)|inventory/?$|export/?$|ebay(?:/|$))) {
        limit_req zone=toga_admin burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/toga-cards-proxy.conf;
    }
    location / { include /etc/nginx/snippets/toga-cards-proxy.conf; }
}
