worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    map $http_host $toga_forwarded_host {
        default $host;
        ~:(?<toga_request_port>[0-9]+)$ $host:$toga_request_port;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    client_max_body_size 8m;
    server {
        listen 3000;
        root /app/admin/public;
        location = /api/health { try_files /__no_static_health__ @laravel; }
        location ~* ^/account(?:/|$) {
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            try_files /__customer_routes__ @laravel;
        }
        location = /api/ebay/callback {
            access_log off;
            proxy_pass http://127.0.0.1:3001;
            include /app/runtime/proxy.conf;
        }
        location ~* ^/api/(inventory|export|admin|ebay)(/|$) { return 404; }
        location ^~ /storage/ {
            alias /app/data/admin-public/;
            add_header X-Content-Type-Options nosniff always;
            autoindex off;
        }
        location ~ ^/(admin(?:/|$)|livewire(?:[-/]|$)|filament(?:/|$)|(?:css|js|fonts)/filament/) {
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            try_files $uri @laravel;
        }
        location @laravel {
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/admin/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_HOST $toga_forwarded_host;
            fastcgi_pass 127.0.0.1:9000;
        }
        location / { proxy_pass http://127.0.0.1:3001; include /app/runtime/proxy.conf; }
    }
}
