[supervisord]
nodaemon=true
pidfile=/tmp/toga-supervisord.pid
logfile=/dev/null
[program:inventory]
command=/usr/local/bin/node /app/.output/server/index.mjs
directory=/app
environment=HOST="127.0.0.1",PORT="3001"
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:admin]
command=/usr/local/sbin/php-fpm --fpm-config /app/runtime/php-fpm.conf
directory=/app/admin
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:gateway]
command=/usr/sbin/nginx -c /app/runtime/nginx.conf -g "daemon off;"
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
