services:
  cards:
    image: ${TOGA_IMAGE:?Supply the verified release image}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3100:3000"
    env_file:
      - path: /etc/toga-cards/runtime.env
        format: raw
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: "3001"
      DATA_DIR: /app/data
    volumes:
      - inventory:/app/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  inventory:
    external: true
    name: toga_cards_production_data
